name: build and deploy

on:
  - workflow_dispatch

env:
  PROJECT_ID: "hayugawe-test"
  REGION: "us-east1"
  SERVICE_NAME: "task-service"
  REPO_NAME: "task-repo"
  CONTEXT_PATH: "./internal/task"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI -f ${{env.CONTEXT_PATH}}/Dockerfile.prod ${{env.CONTEXT_PATH}}
          docker push $IMAGE_URI
