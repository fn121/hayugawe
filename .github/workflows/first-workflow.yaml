name: build and deploy

on:
  workflow_dispatch:
  push:
    branches: main

env:
  PROJECT_ID: "hayugawe-test"
  REGION: "us-east1"
  REPO_NAME: "task-repo" # @todo update repo to project instead per service

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        include:
          - service_name: task-service
            context_path: ./internal/task
          - service_name: frontend-service
            context_path: ./web

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service_name }}:${{ github.sha }}"
          docker build -t $IMAGE_URI -f ${{matrix.context_path}}/Dockerfile.prod ${{matrix.context_path}}
          docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ matrix.service_name }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ matrix.service_name }}:${{ github.sha }}
