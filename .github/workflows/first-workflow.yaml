name: build and deploy

on:
  - workflow_dispatch

env:
  PROJECT_ID: "hayugawe-test"
  REGION: "us-east1"
  SERVICE_NAME: "task-service"
  REPO_NAME: "task-repo"
  CONTEXT_PATH: "./internal/task"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI -f ${{env.CONTEXT_PATH}}/Dockerfile.prod ${{env.CONTEXT_PATH}}
          docker push $IMAGE_URI
